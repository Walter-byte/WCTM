services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wc-telegram-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - wc-telegram-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      BOT_INTERNAL_API_KEY: ${BOT_INTERNAL_API_KEY}
      BOT_INTERNAL_URL: ${BOT_INTERNAL_URL}
      BOT_INTERNAL_PORT: ${BOT_INTERNAL_PORT:-3001}
      BOT_DELIVERY_TIMEOUT_MS: ${BOT_DELIVERY_TIMEOUT_MS:-10000}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
      BOT_BACKEND_TIMEOUT_MS: ${BOT_BACKEND_TIMEOUT_MS}
      BOT_STATUS_WRITE_TIMEOUT_MS: ${BOT_STATUS_WRITE_TIMEOUT_MS}
      TELEGRAM_LINK_TOKEN_TTL_SECONDS: ${TELEGRAM_LINK_TOKEN_TTL_SECONDS}
      TELEGRAM_CALLBACK_SIGNING_KEY: ${TELEGRAM_CALLBACK_SIGNING_KEY}
      TELEGRAM_CALLBACK_REF_TTL_SECONDS: ${TELEGRAM_CALLBACK_REF_TTL_SECONDS}
      TELEGRAM_ORDER_FRESHNESS_THRESHOLD_SECONDS: ${TELEGRAM_ORDER_FRESHNESS_THRESHOLD_SECONDS}
      WOOCOMMERCE_REST_MAX_ATTEMPTS: ${WOOCOMMERCE_REST_MAX_ATTEMPTS}
      WOOCOMMERCE_REST_ATTEMPT_TIMEOUT_MS: ${WOOCOMMERCE_REST_ATTEMPT_TIMEOUT_MS}
      WOOCOMMERCE_REST_TOTAL_TIMEOUT_MS: ${WOOCOMMERCE_REST_TOTAL_TIMEOUT_MS}
      WOOCOMMERCE_REST_BACKOFF_BASE_MS: ${WOOCOMMERCE_REST_BACKOFF_BASE_MS}
      WOOCOMMERCE_REST_BACKOFF_FACTOR: ${WOOCOMMERCE_REST_BACKOFF_FACTOR}
      WOOCOMMERCE_REST_JITTER_RATIO: ${WOOCOMMERCE_REST_JITTER_RATIO}
      PLUGIN_REGISTRATION_TOKEN_TTL_SECONDS: ${PLUGIN_REGISTRATION_TOKEN_TTL_SECONDS}
      PLUGIN_REGISTRATION_RATE_LIMIT: ${PLUGIN_REGISTRATION_RATE_LIMIT}
      PLUGIN_REGISTRATION_RATE_WINDOW_SECONDS: ${PLUGIN_REGISTRATION_RATE_WINDOW_SECONDS}
      PILOT_MODE: ${PILOT_MODE:-false}
      PILOT_WEBHOOK_BASE_URL: ${PILOT_WEBHOOK_BASE_URL:-}
      PILOT_READINESS_TIMEOUT_SECONDS: ${PILOT_READINESS_TIMEOUT_SECONDS:-60}
    ports:
      - '127.0.0.1:${PORT}:${PORT}'
    volumes:
      - ./backend/prisma:/app/backend/prisma:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wc-telegram-net

  telegram-bot:
    build:
      context: .
      dockerfile: telegram-bot/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_INTERNAL_API_KEY: ${BOT_INTERNAL_API_KEY}
      BOT_INTERNAL_PORT: ${BOT_INTERNAL_PORT:-3001}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
      BOT_BACKEND_TIMEOUT_MS: ${BOT_BACKEND_TIMEOUT_MS}
      BOT_STATUS_WRITE_TIMEOUT_MS: ${BOT_STATUS_WRITE_TIMEOUT_MS}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - wc-telegram-net

networks:
  wc-telegram-net: {}

volumes:
  postgres_data:
  redis_data:
