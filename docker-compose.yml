services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wc-telegram-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - wc-telegram-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WOOCOMMERCE_WEBHOOK_SECRET: ${WOOCOMMERCE_WEBHOOK_SECRET}
      WOOCOMMERCE_REST_MAX_ATTEMPTS: ${WOOCOMMERCE_REST_MAX_ATTEMPTS}
      WOOCOMMERCE_REST_ATTEMPT_TIMEOUT_MS: ${WOOCOMMERCE_REST_ATTEMPT_TIMEOUT_MS}
      WOOCOMMERCE_REST_TOTAL_TIMEOUT_MS: ${WOOCOMMERCE_REST_TOTAL_TIMEOUT_MS}
      WOOCOMMERCE_REST_BACKOFF_BASE_MS: ${WOOCOMMERCE_REST_BACKOFF_BASE_MS}
      WOOCOMMERCE_REST_BACKOFF_FACTOR: ${WOOCOMMERCE_REST_BACKOFF_FACTOR}
      WOOCOMMERCE_REST_JITTER_RATIO: ${WOOCOMMERCE_REST_JITTER_RATIO}
      PLUGIN_REGISTRATION_TOKEN_TTL_SECONDS: ${PLUGIN_REGISTRATION_TOKEN_TTL_SECONDS}
      PLUGIN_REGISTRATION_RATE_LIMIT: ${PLUGIN_REGISTRATION_RATE_LIMIT}
      PLUGIN_REGISTRATION_RATE_WINDOW_SECONDS: ${PLUGIN_REGISTRATION_RATE_WINDOW_SECONDS}
    expose:
      - '${PORT}'
    volumes:
      - ./backend/prisma:/app/backend/prisma:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wc-telegram-net

  telegram-bot:
    build:
      context: .
      dockerfile: telegram-bot/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BACKEND_URL: http://backend:${PORT}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - wc-telegram-net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
      BACKEND_PORT: ${PORT}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
    networks:
      - wc-telegram-net

networks:
  wc-telegram-net: {}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
